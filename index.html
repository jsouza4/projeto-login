<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="imagens/book2.ico.png" type="image/x-icon">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
            </div>

            <div id="form">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e fazer as configurações no seu ambiente.</p>
                <form action="login.php" method="post">
                    <div class="campo">
                        <img width="20" height="20" src="https://img.icons8.com/pastel-glyph/64/person-male--v3.png" alt="person-male--v3">
                        <input type="email" name="login" id="ilogin" placeholder="seu e-mail..." maxlength="30" required>
                        <label for="iemail">Login</label>
                    </div>

                    <div class="campo">
                        <img width="20" height="20" src="https://img.icons8.com/material-rounded/24/key--v1.png" alt="key--v1"/>
                        <input type="password" name="senha" id="isenha" placeholder="sua senha..." minlength="8" maxlength="15" required>
                        <label for="isenha">Senha</label>
                    </div>

                    <div class="enviar">
                        <input type="submit" value="Entrar">
                        <a href="esqueci.html" class="botao">Esqueci a senha<img width="15" height="15" src="https://img.icons8.com/ios-glyphs/30/new-post.png" alt="new-post"></a>
                    </div>
                </form>
            </div>
        </section>
    </main>
    
</body>
</html>
