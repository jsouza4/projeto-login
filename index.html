<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="imagens/book2.ico.png" type="image/x-icon">
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">


            </div>

            <div id="form">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e fazer as configurações no seu ambiente.</p>
                <form action="login.php" method="post">
                    <p>
                        <label for="iemail"></label>
                        <input type="email" name="email" id="iemail" placeholder="seu e-mail..." required>
                    </p>

                    <p>
                        <label for="isenha"></label>
                        <input type="password" name="senha" id="isenha" placeholder="sua senha..." minlength="8" maxlength="15" required>
                    </p>

                    <p>
                        <input type="submit" value="Entrar">
                        <input type="submit" value="Esqueci a senha">
                    </p>

                </form>

            </div>
        </section>
    </main>
    
</body>
</html>
